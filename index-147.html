<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oran Analiz — Sıfır Başlangıç</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#07100c;
      color:#f4f7f5;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:24px;
    }
    .card{
      width:min(560px,100%);
      border:1px solid #24392d;
      border-radius:18px;
      padding:28px;
      background:#0d1812;
      text-align:center;
    }
    h1{margin:0 0 10px;font-size:28px}
    p{margin:0;color:#9fb0a7;line-height:1.6}
    .badge{
      display:inline-block;
      margin-top:18px;
      padding:8px 12px;
      border-radius:999px;
      background:#11351f;
      color:#4bea82;
      font-weight:800;
      font-size:13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Oran Analiz</h1>
    <p>Eski sistem kapatıldı. Bu sayfa temiz başlangıç noktasıdır.</p>
    <div class="badge">SIFIR BAŞLANGIÇ</div>
  </main>
</body>
</html>
