<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oran Analiz Aşama 1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06100b;color:#f5f7f5;font-family:system-ui}.app{max-width:760px;margin:auto;padding:18px 15px}h1{font-size:25px}.sub,.league,.time{color:#93a49a}.box,.match{background:#0c1811;border:1px solid #243b2d;border-radius:16px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center}button{background:#12b94e;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:900}.count{font-size:28px;font-weight:900;color:#4be77e}.teams{font-size:18px;font-weight:900;margin:6px 0}</style></head><body><div class="app">
<h1>⚽ Oran Analiz <span style="color:#4be77e">AŞAMA 1</span></h1><div class="sub">Yalnız gerçek maç adı + lig + saat. Oran ve tahmin henüz kapalı.</div>
<div class="box"><div class="row"><div>GERÇEK MAÇ <div id="count" class="count">0</div></div><button id="b">Yenile</button></div><p id="s">Veri bekleniyor.</p></div><div id="list"></div></div>
<script>
const U="https://script.google.com/macros/s/AKfycbwg6AcWgDUywUbos5Jik7KrkwBf5TkN4q-bgEliWkE95QMRiXGOuvAxRweVUocX2qm5Sg/exec",bad=["ilk yarı sonucu","maç sonucu","karşılıklı gol","toplam gol","alt üst","handikap","çifte şans"];
const $=x=>document.getElementById(x),cl=x=>String(x||"").replace(/\s+\d{4,6}$/,"").replace(/\s+/g," ").trim();
function get(o,a){for(const k of a)if(o?.[k]!=null&&o[k]!=="")return o[k]}
function tm(x){return cl(typeof x==="object"?(x?.name||x?.title||""):x)}
function parse(o){if(!o||Array.isArray(o)||typeof o!=="object")return null;let h=get(o,["home","homeTeam","home_team","team1"]),a=get(o,["away","awayTeam","away_team","team2"]),n=get(o,["match","matchName","eventName","name","title"]);
if((!h||!a)&&typeof n==="string"){for(const z of[" - "," – "," — "," vs "])if(n.includes(z)){let p=n.split(z);h=h||p[0];a=a||p.slice(1).join(z);break}}
h=tm(h);a=tm(a);let q=(h+" "+a).toLocaleLowerCase("tr");if(!h||!a||bad.some(x=>q.includes(x))||/^\(?\d+\)?$/.test(h)||/^\(?\d+\)?$/.test(a))return null;
let l=get(o,["league","competition","tournament"]);if(typeof l==="object")l=l?.name||l?.title;let d=get(o,["date","kickoff","startTime","start_time","time"])||o?.fixture?.date||"";return{h,a,l:cl(l)||"Lig bilgisi yok",d:String(d)}}
function walk(v,r,d=0){if(!v||d>7)return;if(Array.isArray(v))return v.forEach(x=>walk(x,r,d+1));if(typeof v!=="object")return;let m=parse(v);if(m)r.push(m);Object.values(v).forEach(x=>{if(x&&typeof x==="object")walk(x,r,d+1)})}
async function load(){$("s").textContent="⏳ Güncel maçlar okunuyor...";try{let r=await fetch(U+(U.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json(),a=[];walk(j,a);let M=new Map;a.forEach(m=>M.set((m.h+"|"+m.a).toLowerCase(),m));a=[...M.values()];$("count").textContent=a.length;$("s").textContent="✅ "+a.length+" benzersiz kayıt. Sadece maç/lig/saat kontrolü."; $("list").innerHTML=a.map(m=>`<div class="match"><div class="league">${m.l}</div><div class="teams">${m.h} — ${m.a}</div><div class="time">🕒 ${m.d||"Saat bilgisi yok"}</div></div>`).join("")}catch(e){$("s").textContent="❌ "+e.message}}$("b").onclick=load;load();
</script></body></html>
